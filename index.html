<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Api</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(to right, skyblue, lavender);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Georgia, "Times New Roman", Times, serif;
        height: 100vh;
      }
      .weather-card {
        text-align: center;
        padding: 25px;
        background: linear-gradient(135deg, #71bba7, #8a83b8);
        box-shadow: 5px 8px 8px 8px #57726b;
        border-radius: 10px;
        width: 350px;
        max-width: 600px;
        color: rgb(16, 50, 82);
        font-family:
          "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      }
      p {
        font-size: 15px;
        text-align: center;
      }
      #Search {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      #city-input {
        padding: 10px;
        width: 200px;
        outline: 0;
        border: 1px solid lightgrey;
        border-radius: 10px;
      }
      #search-btn {
        padding: 10px;
        border: none;
        background-color: rgb(116, 181, 207);
        color: white;
        border-radius: 10px;
        font: bolder;
        /* border-radius: 50%; */
      }
      #search-btn:hover {
        background-color: rgb(23, 138, 177);
      }
      .error {
        color: #d9534f;
        font-weight: bold;
      }
      .hidden {
        display: none;
      }
      .temp {
        font-weight: bolder;
        font-size: 30px;
      }
      .title {
        font-size: 30px;
        text-align: center;
        font-weight: bolder;
        z-index: 1;
        padding: 12px;
        margin-left: 22px;
      }
      #wIcon {
        margin-bottom: 15px;
        width: 70px;
        height: 60px;
        position: absolute;
        /* opacity: 0.8; */
        margin-right: 150px;
        position: absolute;
      }
      #title-icon {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="weather-card">
      <div id="title-icon">
        <img src="weathericon.png" alt="" id="wIcon" />
        <h1 class="title">Weather App</h1>
      </div>

      <div id="Search">
        <input
          type="text"
          name="city"
          id="city-input"
          placeholder="Enter city"
        />
        <button id="search-btn">Search</button>
        <p id="error-msg" class="error hidden"></p>
      </div>

      <div id="display-weather" class="hidden">
        <h2 id="city-name"></h2>
        <img
          id="weather-icon"
          src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png"
          alter="weather-icon"
          width="100px"
          height="100px"
        />
        <p class="temp"><span id="temperature"></span>°C</p>
        <p><b>Description: </b><span id="description"></span></p>
        <p><b>Wind Speed: </b><span id="wind"></span>km/h</p>
        <p>
          <span id="max-min"></span>&nbsp<b>Feels Like: </b
          ><span id="feels-like"></span>°C
        </p>
      </div>
    </div>

    <script>
      // .then(x => x.json())
      // .then(y => console.log(y))

      const cityInput = document.getElementById("city-input");
      const searchBtn = document.getElementById("search-btn");
      const displayWeather = document.getElementById("display-weather");
      const cityName = document.getElementById("city-name");
      const weatherIcon = document.getElementById("weather-icon");
      const temperature = document.getElementById("temperature");
      const description = document.getElementById("description");
      const windS = document.getElementById("wind");
      const maxMin = document.getElementById("max-min");
      const feelsLike = document.getElementById("feels-like");

      async function getWeather() {
        try {
          const response = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?q=${cityInput.value}&appid=191734a53f0fff8e77f5838abdadf6d5&units=metric`,
          );
          const data = await response.json();
          // console.log(data);

          cityName.textContent = `Weather in ${data.name}, ${data.sys.country}`;
          weatherIcon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
          temperature.textContent = data.main.temp;
          description.textContent = data.weather[0].description;
          windS.textContent = data.wind.speed;
          feelsLike.textContent = data.main.feels_like;
          maxMin.textContent = `${data.main.temp_max}°C/${data.main.temp_min}°C`;

          displayWeather.classList.remove("hidden");
          document.getElementById("error-msg").classList.add("hidden");

          cityInput.value = "";
        } catch (error) {
          document.getElementById("error-msg").textContent =
            "Not Found! Please enter a city";
          document.getElementById("error-msg").classList.remove("hidden");
        }
      }

      // displayWeather.innerHTML = `
      // <h2>Weather in ${data.name}, ${data.sys.country}</h2>
      // <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alter="weather-icon">
      // <p>${data.main.temp}°C</p>
      // <p>${data.weather[0].description}</p>
      //  <p>${data.wind.speed} km/h</p>
      // <p>${data.main.feels_like}</p>
      // `;

      searchBtn.addEventListener("click", getWeather);

      cityInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          getWeather();
        }
      });
    </script>
  </body>
</html>
